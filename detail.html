<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint details | VERITAS</title><link rel="stylesheet" href="/css/style.css"></head><body class="appbody"><div th:replace="~{fragments :: sidebar('list')}"></div><main class="appmain"><div th:replace="~{fragments :: topbar}"></div><div class="content narrow"><a href="/citizen/complaints" class="textlink">← All complaints</a><div class="panel detailpanel"><div class="detailhead"><div><small class="idline" th:text="'Complaint #VT-'+${complaint.id}"></small><h1 th:text="${complaint.title}"></h1><p th:text="${complaint.category}+' · '+${complaint.location}"></p></div><span class="status" th:classappend="${#strings.toLowerCase(complaint.status)}" th:text="${complaint.status}"></span></div><hr><h3>Complaint details</h3><p class="detailtext" th:text="${complaint.description}"></p><div class="detailgrid"><div><small>Submitted</small><strong th:text="${#temporals.format(complaint.createdAt,'dd MMM yyyy, HH:mm')}"></strong></div><div><small>Last updated</small><strong th:text="${#temporals.format(complaint.updatedAt,'dd MMM yyyy, HH:mm')}"></strong></div></div><div class="remarks" th:if="${complaint.adminRemarks!=null and !complaint.adminRemarks.isEmpty()}"><strong>Administrator update</strong><p th:text="${complaint.adminRemarks}"></p></div></div></div></main></body></html>
