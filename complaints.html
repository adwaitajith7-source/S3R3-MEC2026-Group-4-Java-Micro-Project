<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My complaints | VERITAS</title><link rel="stylesheet" href="/css/style.css"></head><body class="appbody"><div th:replace="~{fragments :: sidebar('list')}"></div><main class="appmain"><div th:replace="~{fragments :: topbar}"></div><div class="content"><div class="welcome"><div><div class="eyebrow">YOUR REQUESTS</div><h1>My complaints</h1><p>Every submission, all in one place.</p></div><a class="btn primary" href="/citizen/complaints/new">＋ New complaint</a></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>COMPLAINT</th><th>CATEGORY</th><th>LOCATION</th><th>SUBMITTED</th><th>STATUS</th><th></th></tr></thead><tbody><tr th:each="c:${complaints}"><td><strong th:text="${c.title}">Title</strong><small class="idline" th:text="'#VT-'+${c.id}"></small></td><td th:text="${c.category}"></td><td th:text="${c.location}"></td><td th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}"></td><td><span class="status" th:classappend="${#strings.toLowerCase(c.status)}" th:text="${c.status}"></span></td><td><a class="textlink" th:href="@{/citizen/complaints/{id}(id=${c.id})}">Track →</a></td></tr><tr th:if="${#lists.isEmpty(complaints)}"><td colspan="6" class="empty">No complaints to show.</td></tr></tbody></table></div></div></div></main></body></html>
