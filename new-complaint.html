<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New complaint | VERITAS</title><link rel="stylesheet" href="/css/style.css"></head><body class="appbody"><div th:replace="~{fragments :: sidebar('new')}"></div><main class="appmain"><div th:replace="~{fragments :: topbar}"></div><div class="content narrow"><div class="welcome"><div><div class="eyebrow">NEW REQUEST</div><h1>Submit a complaint</h1><p>Tell us what's happening. We'll make sure it reaches the right team.</p></div></div><div class="panel formpanel"><form method="post" action="/citizen/complaints"><label>Complaint title <span>*</span></label><input name="title" maxlength="180" placeholder="A short summary of the issue" required><label>Category <span>*</span></label><select name="category" required><option value="">Choose a category</option><option>Roads & Infrastructure</option><option>Water supply</option><option>Sanitation & Waste</option><option>Electricity</option><option>Public safety</option><option>Healthcare</option><option>Other</option></select><label>Location <span>*</span></label><input name="location" maxlength="240" placeholder="Street, ward or area" required><label>Description <span>*</span></label><textarea name="description" rows="6" maxlength="3000" placeholder="Describe the issue and any details that could help us address it…" required></textarea><div class="formhint">Please provide clear and accurate details to help with timely resolution.</div><div class="formactions"><a href="/citizen/dashboard" class="btn outline">Cancel</a><button class="btn primary" type="submit">Submit complaint →</button></div></form></div></div></main></body></html>
